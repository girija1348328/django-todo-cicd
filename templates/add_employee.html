{% extends 'base.html' %}
{% block content %}
<h2>Add Employee</h2>
<form id="addEmployeeForm" method="POST" action="/add_employee" enctype="multipart/form-data" class="mt-3">
  <div class="mb-3">
    <label for="office_employee_id" class="form-label">Office Employee ID</label>
    <input type="text" class="form-control" id="office_employee_id" name="office_employee_id" required>
  </div>
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" required>
  </div>
  <div class="mb-3">
    <label for="designation" class="form-label">Designation</label>
    <input type="text" class="form-control" id="designation" name="designation" required>
  </div>
  <div class="mb-3">
    <label for="department" class="form-label">Department</label>
    <input type="text" class="form-control" id="department" name="department" required>
  </div>
  <div class="mb-3">
    <label for="location" class="form-label">Location</label>
    <input type="text" class="form-control" id="location" name="location" required>
  </div>
  <div class="mb-3">
    <label for="images" class="form-label">Images (select multiple)</label>
    <input class="form-control" type="file" id="images" name="images" accept="image/*" required multiple>
  </div>
  <button type="submit" class="btn btn-primary">Add Employee</button>
</form>

<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="successModalLabel">Success</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Employee added successfully!
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="successOkBtn" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('addEmployeeForm').onsubmit = function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  fetch('/add_employee', {
    method: 'POST',
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        const modal = new bootstrap.Modal(document.getElementById('successModal'));
        modal.show();
        document.getElementById('successOkBtn').onclick = function() {
          document.getElementById('addEmployeeForm').reset();
        };
      } else {
        alert(data.message || 'Error adding employee.');
      }
    })
    .catch(() => {
      alert('An error occurred while adding the employee.');
    });
};
</script>
{% endblock %}
