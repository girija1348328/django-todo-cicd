{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Live Detection Grid</h2>

<!-- Camera Grid -->
<div class="row" id="cameraGrid">
    <!-- Camera feeds will be inserted here by JavaScript -->
</div>

<!-- Recent Detections Panel -->
<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="fas fa-users"></i> Recent Detections</h5>
            </div>
            <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                <div id="recentDetectionsPanel">
                    <p class="text-muted">No detections yet</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function loadCameraFeeds() {
    fetch('/camera_feeds')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(feeds => {
            const activeFeeds = feeds.filter(feed => feed.is_active);
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = ''; // Clear existing content

            if (activeFeeds.length === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-warning" role="alert">
                            <strong>No active camera feeds.</strong> Please add and activate a camera from the Camera Feeds page.
                        </div>
                    </div>`;
                return;
            }

            // Create the 3x3 grid
            activeFeeds.forEach(feed => {
                const col = document.createElement('div');
                // Use col-lg-4 for large screens, col-md-6 for medium
                col.className = 'col-lg-4 col-md-6 mb-4';
                
                col.innerHTML = `
                    <div class="card h-100 shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <strong class="text-truncate" title="${feed.name}">${feed.name}</strong>
                            <span class="badge bg-secondary">${feed.location || 'N/A'}</span>
                        </div>
                        <div class="card-body p-1 d-flex align-items-center justify-content-center bg-dark">
                            <img src="/live_detection?camera_feed_id=${feed.id}" 
                                 class="img-fluid" 
                                 style="max-height: 280px; width: 100%; object-fit: contain;" 
                                 alt="Live feed for ${feed.name}"
                                 onerror="this.onerror=null; this.src='/static/placeholder.jpg'; this.alt='Error loading feed.';">
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        })
        .catch(error => {
            console.error('Error fetching camera feeds:', error);
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger" role="alert">
                        <strong>Error:</strong> Could not load camera feeds. Please ensure the server is running and check the console for details.
                    </div>
                </div>`;
        });
}

document.addEventListener('DOMContentLoaded', loadCameraFeeds);
</script>
{% endblock %}
