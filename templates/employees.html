{% extends 'base.html' %}
{% block content %}
<h2>Employee Database</h2>
<div class="row mt-3 mb-2">
  <div class="col-md-6">
    <input type="text" id="searchInput" class="form-control" placeholder="Search by name or ID...">
  </div>
</div>
<div class="table-responsive">
  <table class="table table-bordered" id="employees-table">
    <thead class="table-dark">
      <tr>
        <th>Image</th>
        <th>Office Employee ID</th>
        <th>Name</th>
        <th>Designation</th>
        <th>Department</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>
<nav>
  <ul class="pagination" id="pagination">
  </ul>
</nav>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editForm" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Employee</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" name="id">
          <div class="mb-3">
            <label for="edit-office-employee-id" class="form-label">Office Employee ID</label>
            <input type="text" class="form-control" id="edit-office-employee-id" name="office_employee_id" required>
          </div>
          <div class="mb-3">
            <label for="edit-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="edit-name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="edit-designation" class="form-label">Designation</label>
            <input type="text" class="form-control" id="edit-designation" name="designation" required>
          </div>
          <div class="mb-3">
            <label for="edit-department" class="form-label">Department</label>
            <input type="text" class="form-control" id="edit-department" name="department" required>
          </div>
          <div class="mb-3">
            <label for="edit-location" class="form-label">Location</label>
            <input type="text" class="form-control" id="edit-location" name="location" required>
          </div>
          <div class="mb-3">
            <label for="edit-images" class="form-label">Add more photos to improve recognition (optional)</label>
            <input class="form-control" type="file" id="edit-images" name="images" accept="image/*" multiple>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
let employeesData = [];
let filteredData = [];
let currentPage = 1;
const pageSize = 5;

function renderTablePage(page) {
  const tbody = document.querySelector('#employees-table tbody');
  tbody.innerHTML = '';
  const start = (page - 1) * pageSize;
  const end = start + pageSize;
  const pageData = filteredData.slice(start, end);
  pageData.forEach(e => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><img src="${e.image_url}" alt="${e.name}" width="80" height="80" style="object-fit:cover;"></td>
      <td>${e.office_employee_id}</td>
      <td>${e.name}</td>
      <td>${e.designation}</td>
      <td>${e.department}</td>
      <td>${e.location}</td>
      <td>
        <button class="btn btn-sm btn-warning me-2" onclick="editEmployee(${e.id})">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${e.id})">Delete</button>
      </td>
    `;
    tbody.appendChild(row);
  });
}

function renderPagination() {
  const pagination = document.getElementById('pagination');
  pagination.innerHTML = '';
  const pageCount = Math.ceil(filteredData.length / pageSize);
  for (let i = 1; i <= pageCount; i++) {
    const li = document.createElement('li');
    li.className = 'page-item' + (i === currentPage ? ' active' : '');
    li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
    li.onclick = function(e) {
      e.preventDefault();
      currentPage = i;
      renderTablePage(currentPage);
      renderPagination();
    };
    pagination.appendChild(li);
  }
}

function filterData() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  filteredData = employeesData.filter(e =>
    e.office_employee_id.toLowerCase().includes(search) ||
    e.name.toLowerCase().includes(search) ||
    e.designation.toLowerCase().includes(search) ||
    e.department.toLowerCase().includes(search) ||
    e.location.toLowerCase().includes(search)
  );
  currentPage = 1;
  renderTablePage(currentPage);
  renderPagination();
}

function loadEmployees() {
  fetch('/employees')
    .then(res => res.json())
    .then(data => {
      employeesData = data;
      filteredData = data;
      filterData();
    });
}

document.getElementById('searchInput').addEventListener('input', filterData);

function deleteEmployee(id) {
  if (!confirm('Are you sure you want to delete this employee?')) return;
  fetch(`/delete_employee/${id}`, {method: 'POST'})
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      loadEmployees();
    });
}

function editEmployee(id) {
  const e = employeesData.find(x => x.id === id);
  if (!e) return;
  document.getElementById('edit-id').value = e.id;
  document.getElementById('edit-office-employee-id').value = e.office_employee_id;
  document.getElementById('edit-name').value = e.name;
  document.getElementById('edit-designation').value = e.designation;
  document.getElementById('edit-department').value = e.department;
  document.getElementById('edit-location').value = e.location;
  document.getElementById('edit-images').value = '';
  const modal = new bootstrap.Modal(document.getElementById('editModal'));
  modal.show();
}

document.getElementById('editForm').onsubmit = function(e) {
  e.preventDefault();
  const id = document.getElementById('edit-id').value;
  const formData = new FormData(this);
  fetch(`/edit_employee/${id}`, {
    method: 'POST',
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.status === 'success') {
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        loadEmployees();
      }
    });
};

loadEmployees();
</script>
{% endblock %}
